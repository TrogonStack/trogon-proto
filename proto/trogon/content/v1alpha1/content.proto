syntax = "proto3";
package trogon.content.v1alpha1;

import "elixirpb.proto";

option (elixirpb.file).module_prefix = "TrogonProto.Content.V1Alpha1";

// Content is a self-describing blob whose interpretation is carried by its
// media type.
//
// Use Content for "give me whatever" fields where the producer and consumer
// negotiate the concrete encoding out of band, and protobuf only needs to
// transport the typed bytes. Prefer explicit domain messages when the schema
// is known at design time; reach for Content only when the schema is open or
// pluggable.
//
// Example usage:
//
//   import "trogon/content/v1alpha1/content.proto";
//
//   message PublishRequest {
//     string subject = 1;
//     trogon.content.v1alpha1.Content body = 2;
//   }
message Content {
  // content_type is the IANA media type that classifies data.
  //
  // Format follows RFC 6838 (for example "application/json",
  // "application/protobuf", "text/plain; charset=utf-8"). Consumers use this
  // value to select a decoder for data.
  string content_type = 1;

  // data is the opaque payload bytes whose interpretation is given by
  // content_type.
  bytes data = 2;
}
